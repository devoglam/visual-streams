<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources · Visual Streams</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { display: grid; grid-template-columns: 280px 1fr; gap: 28px; padding: 18px 22px 80px; max-width: 1400px; }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  aside .panel { padding: 8px; position: sticky; top: 80px; }
  .tlist { list-style: none; margin: 0; padding: 0; }
  .tlist li { display: flex; align-items: center; gap: 4px; border-radius: 7px; }
  .tlist li button.name { flex: 1; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 7px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .tlist li button.name span { color: var(--muted); font-size: 12px; }
  .tlist li.sel button.name { background: var(--chip); font-weight: 600; }
  .tlist li .mv { opacity: 0; border: 0; background: none; width: 24px; height: 28px; color: var(--muted); border-radius: 5px; }
  .tlist li:hover .mv, .tlist li.sel .mv { opacity: 1; }
  .tlist li .mv:hover { background: var(--chip); color: var(--ink); }
  .addtab { display: flex; gap: 6px; padding: 8px 4px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn.danger { background: transparent; color: #b4331f; border-color: color-mix(in srgb, #b4331f 40%, transparent); }
  .head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .head .title { flex: 1; min-width: 240px; }
  .head input.tname { font-size: 26px; font-weight: 700; letter-spacing: -.02em; border-color: transparent; background: transparent; padding: 2px 6px; margin-left: -7px; width: 100%; }
  .head input.tname:hover { border-color: var(--line); }
  .add { padding: 16px; margin-bottom: 18px; display: grid; gap: 10px; }
  .add textarea { min-height: 92px; resize: vertical; font-size: 13px; }
  .add .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { font-size: 13px; }
  .note.ok { color: #2d7a3e; } .note.warn { color: #a5641a; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 64px; background: var(--surface); z-index: 1; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.site b { font-weight: 600; display: block; }
  td.site a { color: var(--muted); font-size: 12px; text-decoration: none; }
  td.site a:hover { text-decoration: underline; }
  td input.grp { width: 130px; padding: 5px 8px; font-size: 12.5px; background: transparent; border-color: transparent; }
  td input.grp:hover, td input.grp:focus { border-color: var(--line); background: var(--bg); }
  td select { padding: 5px 6px; font-size: 12.5px; max-width: 150px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.g { background: #3a9a52; } .dot.y { background: #d0952c; } .dot.r { background: #c4472f; } .dot.n { background: var(--line); }
  .rowbtn { border: 0; background: none; color: var(--muted); padding: 5px 7px; border-radius: 6px; font-size: 12.5px; }
  .rowbtn:hover { background: var(--chip); color: var(--ink); }
  .toolbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 160px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .crawl { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; padding: 12px 16px 60px; }
    aside .panel { position: static; }
    th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>
<header class="top scrolled">
  <div class="bar">
    <a class="brand" href="./">Visual Streams <span>/ Sources</span></a>
    <div style="flex:1"></div>
    <div class="crawl" id="crawl"></div>
    <a class="icon-btn" href="./">← Back to streams</a>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="panel">
      <ul class="tlist" id="tlist"></ul>
      <form class="addtab" id="addTab">
        <input id="newTab" placeholder="New tab name" aria-label="New tab name" style="flex:1">
        <button class="btn" type="submit">Add</button>
      </form>
    </div>
  </aside>

  <section id="main"></section>
</div>
<div class="toast" id="toast"></div>
<datalist id="groups"></datalist>

<script src="manage.js"></script>
</body>
</html>
