name: Update Visual Streams

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours: each run continues working through every studio's projects
  push:
    paths:
      - "data/sources.json"
      - "public/**"
      - "*.js"
      - ".github/workflows/**"
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: visual-streams
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Visit sites and build the website
        run: node build.js
      - name: Remember which images were seen when
        continue-on-error: true   # never let this step stop the site from publishing
        run: |
          git config user.name "visual-streams-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Update image history" --quiet
            git pull --rebase -X theirs || git rebase --abort
            git push || echo "Couldn't save image history this time; the site will still publish."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
